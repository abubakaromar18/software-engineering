[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-api"
version = "1.0.0"
description = "Product catalog & ordering API - the provider side of a consumer-driven contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "pact-python>=3.0",
    "ruff>=0.6",
]

[project.scripts]
catalog-api = "catalog_api.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "contract: Pact provider verification (replays consumer contracts against a live server)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
