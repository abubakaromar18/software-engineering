[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pbtlab"
version = "1.0.0"
description = "Property-based testing lab: a sorting, encoding and date-range library, and the Hypothesis properties that catch real bugs in it."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }
# The library itself is dependency-free; Hypothesis powers the strategies and the hunt CLI.
dependencies = []

[project.optional-dependencies]
lab = ["hypothesis>=6.100"]
test = ["hypothesis>=6.100", "pytest>=8"]

[project.scripts]
pbtlab-hunt = "pbtlab.hunts:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
