[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gilded-rose-refactor"
version = "1.0.0"
description = "The Gilded Rose kata: characterization tests, then a step-by-step refactor."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[project.scripts]
gilded-rose = "gilded_rose.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
