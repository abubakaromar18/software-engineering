# Support desk chain configuration.
#
# `chain` lists handler instance names in the order a ticket visits them.
# Each instance picks its implementation with `<name>.type`; the remaining
# `<name>.*` keys are that type's settings. Unknown keys are a startup error.

chain = spam, faq, tier1, tier2, engineering

# 1. Throw away obvious spam before a person ever sees it.
spam.type = spam-filter
spam.blocked-phrases = free money, crypto giveaway, click this link, you have won

# 2. Answer simple, low-severity questions automatically.
faq.type = faq-bot
faq.max-severity = LOW
faq.answer.forgot\ password = Reset it from the sign-in page via "Forgot password?"; the link is valid for 30 minutes.
faq.answer.invoice = Invoices are under Billing > History, where each one can be downloaded as a PDF.
faq.answer.export = Use Settings > Data > Export to download your data as CSV.

# 3. Front-line agents: account and billing questions, small queue.
tier1.type = agent-tier
tier1.display-name = Tier 1
tier1.categories = ACCOUNT, BILLING
tier1.max-severity = MEDIUM
tier1.capacity = 3

# 4. Specialists: anything but OTHER, up to HIGH severity, no queue limit.
tier2.type = agent-tier
tier2.display-name = Tier 2
tier2.categories = ACCOUNT, BILLING, TECHNICAL
tier2.max-severity = HIGH

# 5. Catch-all: everything left goes to engineering; CRITICAL pages on-call.
engineering.type = engineering-escalation
engineering.page-at = CRITICAL
